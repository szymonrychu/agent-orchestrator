# A plain, throwaway Postgres for the kind e2e (scripts/e2e.sh applies it into namespace
# agents). e2e/values-kind.yaml points postgres.url at the Service below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agent-orchestrator-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: agent-orchestrator-e2e
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: orch
            - name: POSTGRES_PASSWORD
              value: orch-e2e-password
            - name: POSTGRES_DB
              value: orch
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orch", "-d", "orch"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agent-orchestrator-e2e
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
