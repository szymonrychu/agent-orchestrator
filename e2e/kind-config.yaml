# kind cluster for scripts/e2e.sh (mise run test:e2e). One node: the agent pods, the chart's
# Deployments and the e2e Postgres all share it, so a node-local shared directory backs the
# ReadWriteMany workspace PVCs (scripts/e2e.sh configures the StorageClass).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agents-orchestrator-e2e
nodes:
  - role: control-plane
