name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARBOR_URL: harbor.szymonrichert.pl
      IMAGE: harbor.szymonrichert.pl/containers/agents-orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Compute short sha
        run: echo "SHORTSHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t agents-orchestrator:ci .
      - name: Smoke test
        run: docker run --rm agents-orchestrator:ci --help
      - uses: regclient/actions/regctl-installer@main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Login to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | regctl registry login "$HARBOR_URL" -u "$HARBOR_USERNAME" --pass-stdin
      # Cloudflare in front of Harbor answers 413 to request bodies over 100MB,
      # so layers go up in 50MB chunks instead of docker push's single upload.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save agents-orchestrator:ci -o image.tar
          regctl registry set "$HARBOR_URL" --blob-chunk 52428800 --blob-max 52428800
          regctl image import "$IMAGE:$SHORTSHA" image.tar

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint:chart
      - run: uv run pytest tests/test_chart_*.py -q

  e2e:
    needs: [images, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # The test agent image builds on the private claude-code-wrapper image in Harbor.
      # Without credentials (fork PRs) scripts/e2e.sh builds that wrapper commit from source.
      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          if [ -n "$HARBOR_USERNAME" ]; then
            echo "$HARBOR_PASSWORD" | docker login harbor.szymonrichert.pl -u "$HARBOR_USERNAME" --password-stdin \
              || echo "Harbor login failed; the wrapper base image is built from source"
          fi
      - run: mise run test:e2e

  chart-publish:
    needs: [chart, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HARBOR_URL: harbor.szymonrichert.pl
      CHART_REPO: oci://harbor.szymonrichert.pl/charts
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: regclient/actions/regctl-installer@main
      - name: Compute version
        run: |
          SHA7="${GITHUB_SHA::7}"
          VERSION="$(scripts/chart-version.sh branch "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "SHA7=$SHA7" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # Harbor robot accounts reject the Helm 4 login probe, so credentials are written to the registry config.json.
          mkdir -p "$HOME/.config/helm/registry"
          AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_URL" "$AUTH" > "$HOME/.config/helm/registry/config.json"
          echo "$HARBOR_PASSWORD" | regctl registry login "$HARBOR_URL" -u "$HARBOR_USERNAME" --pass-stdin
      - name: Refuse an existing version
        run: |
          if helm show chart "$CHART_REPO/agents-orchestrator" --version "$VERSION" > /dev/null 2>&1; then
            echo "chart version $VERSION already published; bump chart/agents-orchestrator/Chart.yaml version"
            exit 1
          fi
      - name: Package
        run: helm package chart/agents-orchestrator --version "$VERSION" --app-version "$SHA7"
      - name: Push
        run: helm push "agents-orchestrator-$VERSION.tgz" "$CHART_REPO"

  chart-publish-tag:
    needs: [chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HARBOR_URL: harbor.szymonrichert.pl
      CHART_REPO: oci://harbor.szymonrichert.pl/charts
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: regclient/actions/regctl-installer@main
      - name: Compute version
        run: |
          SHA7="${GITHUB_SHA::7}"
          VERSION="$(scripts/chart-version.sh tag "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "SHA7=$SHA7" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # Harbor robot accounts reject the Helm 4 login probe, so credentials are written to the registry config.json.
          mkdir -p "$HOME/.config/helm/registry"
          AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_URL" "$AUTH" > "$HOME/.config/helm/registry/config.json"
          echo "$HARBOR_PASSWORD" | regctl registry login "$HARBOR_URL" -u "$HARBOR_USERNAME" --pass-stdin
      - name: Refuse an existing version
        run: |
          if helm show chart "$CHART_REPO/agents-orchestrator" --version "$VERSION" > /dev/null 2>&1; then
            echo "chart version $VERSION already published; bump chart/agents-orchestrator/Chart.yaml version"
            exit 1
          fi
      - name: Require the built image
        run: regctl image digest "$HARBOR_URL/containers/agents-orchestrator:$SHA7" > /dev/null || { echo "image harbor.szymonrichert.pl/containers/agents-orchestrator:$SHA7 not found; tag a commit main CI already built"; exit 1; }
      - name: Package
        run: helm package chart/agents-orchestrator --version "$VERSION" --app-version "$SHA7"
      - name: Push
        run: helm push "agents-orchestrator-$VERSION.tgz" "$CHART_REPO"
