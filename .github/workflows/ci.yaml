name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:api

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARBOR_URL: harbor.szymonrichert.pl
      IMAGE: harbor.szymonrichert.pl/containers/agent-orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Compute short sha
        run: echo "SHORTSHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t agent-orchestrator:ci .
      - name: Smoke test
        run: docker run --rm agent-orchestrator:ci --help
      - uses: regclient/actions/regctl-installer@main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Login to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | regctl registry login "$HARBOR_URL" -u "$HARBOR_USERNAME" --pass-stdin
      # Cloudflare in front of Harbor answers 413 to request bodies over 100MB,
      # so layers go up in 50MB chunks instead of docker push's single upload.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save agent-orchestrator:ci -o image.tar
          regctl registry set "$HARBOR_URL" --blob-chunk 52428800 --blob-max 52428800
          regctl image import "$IMAGE:$SHORTSHA" image.tar
