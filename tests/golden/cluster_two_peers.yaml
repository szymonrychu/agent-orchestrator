- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: agent-alpha-workspace
    namespace: agents
    labels:
      agents.szymonrichert.pl/cluster: alpha
      app.kubernetes.io/managed-by: agent-orchestrator
  spec:
    accessModes:
    - ReadWriteMany
    storageClassName: rook-ceph-rwx
    resources:
      requests:
        storage: 5Gi
- apiVersion: v1
  kind: Secret
  metadata:
    name: agent-alpha-ccw
    namespace: agents
    labels:
      agents.szymonrichert.pl/cluster: alpha
      app.kubernetes.io/managed-by: agent-orchestrator
  type: Opaque
  stringData:
    CCW_AUTH_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    CCW_PEER_TOKEN: pppppppppppppppppppppppppppppppp
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: agent-alpha-config
    namespace: agents
    labels:
      agents.szymonrichert.pl/cluster: alpha
      app.kubernetes.io/managed-by: agent-orchestrator
  data:
    config.yaml: "server:\n  auth_token: ${CCW_AUTH_TOKEN}\npaths:\n  workdir_root:\
      \ /workdir\n  sessions_root: /sessions\nclaude:\n  passthrough_env:\n  - AAA\n\
      \  - GITHUB_TOKEN\n  env:\n    claude_code_oauth_token: ${CLAUDE_CODE_OAUTH_TOKEN}\n\
      \    disable_autoupdater: true\n    claude_autocompact_pct_override: 95\n  model:\
      \ opus\n  effort: high\n  permissions:\n    deny:\n    - EnterPlanMode\n   \
      \ - ExitPlanMode\n    - AskUserQuestion\n  mcp_servers:\n    any-mcp:\n    \
      \  type: stdio\n      command: /opt/any-mcp/bin/any-mcp\n      args:\n     \
      \ - --config\n      - /opt/any-mcp/etc/any-mcp.yaml\nhooks:\n  onStart:\n  -\
      \ type: command\n    run: sh /etc/ccw/on-start.sh\n    blocking: true\n    on_error:\
      \ deny\n    timeout_seconds: 600.0\nsessions:\n  max_sessions: 1\n  resume_on_start:\
      \ true\n  idle_timeout_seconds: 0\n  ask_user_question: deny\nprompts:\n  system_append:\
      \ 'The AskUserQuestion tool is disabled and nobody answers interactive\n   \
      \ questions. When you need a decision or information from the user, ask in writing\n\
      \    in your reply: write a numbered list of questions, and after each question\
      \ give\n    your recommended answer, worded so that replying \"yes\" accepts\
      \ it. Then stop and\n    wait for the reply. Never wait on an interactive question\
      \ tool.'\nlimits:\n  shutdown_timeout_seconds: 80\npeers:\n  enabled: true\n\
      \  name: ${POD_NAME}\n  advertise_url: ${CCW_PEER_URL}\n  token: ${CCW_PEER_TOKEN}\n\
      \  static:\n  - http://agent-alpha-0.agent-alpha.agents.svc.cluster.local:8080\n\
      \  - http://agent-alpha-1.agent-alpha.agents.svc.cluster.local:8080\n"
    on-start.sh: "#!/bin/sh\nset -eu\nREF=v0.1.0\nif ! grep -qxF -- \"$REF\" /opt/any-mcp/.ref\
      \ 2>/dev/null; then\n  rm -rf /opt/any-mcp/* /opt/any-mcp/.ref\n  python3 -m\
      \ venv /opt/any-mcp\n  /opt/any-mcp/bin/pip install --no-cache-dir 'any-mcp\
      \ @ git+https://github.com/szymonrychu/any-mcp@v0.1.0'\n  printf '%s\\n' \"\
      $REF\" > /opt/any-mcp/.ref\nfi\nmkdir -p /opt/any-mcp/etc\ncat > /opt/any-mcp/etc/any-mcp.yaml\
      \ <<'ANY_MCP_CONFIG_EOF'\n{\n  \"servers\": {}\n}\nANY_MCP_CONFIG_EOF\n/opt/any-mcp/bin/any-mcp\
      \ --help >/dev/null\n"
- apiVersion: v1
  kind: Service
  metadata:
    name: agent-alpha
    namespace: agents
    labels:
      agents.szymonrichert.pl/cluster: alpha
      app.kubernetes.io/managed-by: agent-orchestrator
  spec:
    clusterIP: None
    publishNotReadyAddresses: true
    selector:
      agents.szymonrichert.pl/cluster: alpha
      app.kubernetes.io/managed-by: agent-orchestrator
    ports:
    - name: http
      port: 8080
      targetPort: 8080
- apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    name: agent-alpha
    namespace: agents
    labels:
      agents.szymonrichert.pl/cluster: alpha
      app.kubernetes.io/managed-by: agent-orchestrator
  spec:
    replicas: 2
    podManagementPolicy: Parallel
    serviceName: agent-alpha
    selector:
      matchLabels:
        agents.szymonrichert.pl/cluster: alpha
        app.kubernetes.io/managed-by: agent-orchestrator
    template:
      metadata:
        labels:
          agents.szymonrichert.pl/cluster: alpha
          app.kubernetes.io/managed-by: agent-orchestrator
        annotations:
          agents.szymonrichert.pl/config-hash: 786a308e37509eabfb36351515d306e3d482f053202db3a888f137621654353a
      spec:
        imagePullSecrets:
        - name: regcred
        securityContext:
          runAsUser: 1000
          fsGroup: 1000
        terminationGracePeriodSeconds: 90
        containers:
        - name: ccw
          image: harbor.example/containers/claude-code-wrapper:ca2ddf3
          ports:
          - name: http
            containerPort: 8080
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: CCW_PEER_URL
            value: http://$(POD_NAME).agent-alpha.agents.svc.cluster.local:8080
          - name: CCW_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: agent-alpha-ccw
                key: CCW_AUTH_TOKEN
          - name: CCW_PEER_TOKEN
            valueFrom:
              secretKeyRef:
                name: agent-alpha-ccw
                key: CCW_PEER_TOKEN
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: agent-orchestrator-claude
                key: CLAUDE_CODE_OAUTH_TOKEN
          - name: AAA
            value: '1'
          - name: GITHUB_TOKEN
            value: x
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 132
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          volumeMounts:
          - name: workspace
            mountPath: /workdir
            subPath: workdir
          - name: workspace
            mountPath: /sessions
            subPathExpr: sessions/$(POD_NAME)
          - name: mise
            mountPath: /opt/mise
          - name: any-mcp
            mountPath: /opt/any-mcp
          - name: config
            mountPath: /etc/ccw
          resources:
            requests:
              cpu: 500m
            limits:
              memory: 2Gi
        volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-alpha-workspace
        - name: config
          configMap:
            name: agent-alpha-config
        - name: mise
          emptyDir: {}
        - name: any-mcp
          emptyDir: {}
