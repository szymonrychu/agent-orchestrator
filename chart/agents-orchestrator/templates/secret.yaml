{{- $source := include "agents-orchestrator.postgresSource" . }}
{{- if or (eq $source "url") (eq $source "parts") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-database
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ include "agents-orchestrator.databaseUri" . | quote }}
---
{{- end }}
{{- if and .Values.masterKey.value (not .Values.masterKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.masterKeySecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ .Values.masterKey.value | quote }}
---
{{- end }}
{{- if and .Values.serviceApi.tokenHashes (not .Values.serviceApi.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.serviceTokensSecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.serviceApi.existingSecretKey | default "service-tokens" }}: {{ include "agents-orchestrator.serviceTokensCsv" . | quote }}
---
{{- end }}
{{- if and .Values.claude.token (not .Values.claude.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.claudeSecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.claude.token | quote }}
{{- end }}
