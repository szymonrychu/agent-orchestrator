{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.serviceAccountName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# The only identity that reaches the Kubernetes API; bound to the reconciler Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-reconciler
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
# Unprivileged identity of agent pods without kube_access and of every Job: no binding,
# no token (ORCH_AGENT_SERVICE_ACCOUNT).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-agent
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.kubeAccess.enabled }}
---
# Privileged identity of kube_access agent pods (ORCH_KUBE_ACCESS_SERVICE_ACCOUNT), bound to
# cluster-admin by kube-access-binding.yaml. Rendered regardless of serviceAccount.create: it
# is the feature's identity. No token by default; opted-in pods mount it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-kube-access
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-access
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
