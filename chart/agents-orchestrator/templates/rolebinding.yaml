{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agents-orchestrator.fullname" . }}-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ include "agents-orchestrator.fullname" . }}-reconciler
    namespace: {{ .Release.Namespace }}
{{- end }}
