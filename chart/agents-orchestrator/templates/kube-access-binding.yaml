{{- if and .Values.kubeAccess.enabled .Values.rbac.create }}
# The one non-namespaced object of the chart, gated by kubeAccess.enabled: binds the
# <fullname>-kube-access ServiceAccount to the built-in cluster-admin ClusterRole (D2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-kube-access
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "agents-orchestrator.fullname" . }}-kube-access
    namespace: {{ .Release.Namespace }}
{{- end }}
