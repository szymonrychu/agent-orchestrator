{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-orchestrator.serviceAccountName" . }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# The only identity that reaches the Kubernetes API; bound to the reconciler Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}-reconciler
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
