{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- range $component, $cfg := .Values.components }}
{{- $labels := dict "context" $ "component" $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-orchestrator.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agent-orchestrator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $cfg.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "agent-orchestrator.componentLabels" $labels | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- with merge (deepCopy ($cfg.podAnnotations | default dict)) ($.Values.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agent-orchestrator.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $component "reconciler" }}
      serviceAccountName: {{ include "agent-orchestrator.fullname" $ }}-reconciler
      {{- else }}
      serviceAccountName: {{ include "agent-orchestrator.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["orch"]
          args: ["migrate"]
          {{- include "agent-orchestrator.env" $ | nindent 10 }}
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["orch"]
          args:
            - {{ $component }}
            {{- range $cfg.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- include "agent-orchestrator.env" $ | nindent 10 }}
          {{- if eq $component "api" }}
            - name: ORCH_HTTP_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: agents
              containerPort: {{ $.Values.agentApi.port }}
              protocol: TCP
            - name: services
              containerPort: {{ $.Values.serviceApi.port }}
              protocol: TCP
          livenessProbe:
            {{- $cfg.livenessProbe | default (dict "httpGet" (dict "path" "/healthz" "port" "http")) | toYaml | nindent 12 }}
          readinessProbe:
            {{- $cfg.readinessProbe | default (dict "httpGet" (dict "path" "/readyz" "port" "http")) | toYaml | nindent 12 }}
          {{- else }}
          {{- with $cfg.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cfg.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
