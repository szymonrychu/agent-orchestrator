# Default values for agent-orchestrator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.szymonrichert.pl/containers/agent-orchestrator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# The reconciler Role and RoleBinding (namespaced, release namespace only). The Role is
# bound to the <fullname>-reconciler ServiceAccount.
rbac:
  create: true

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Source CIDRs the ingress refuses (rendered as the ingress-nginx denylist annotation when non-empty).
  # Pods egress SNATed as node IPs, so list the cluster node IPs here; see README Security.
  denySourceRanges: []
  # Source CIDRs the ingress admits (rendered as the ingress-nginx allow-list annotation when non-empty).
  allowSourceRanges: []
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# The four orchestrator processes, each its own Deployment <fullname>-<component> running
# `orch <component>`. The ingester and reconciler hold advisory locks, so a second replica
# is a hot standby and replicas above 1 are safe. Probes given here replace the defaults;
# the api defaults to /healthz (liveness) and /readyz (readiness), the others to none.
components:
  api:
    replicas: 1
    resources: {}
    extraArgs: []
    livenessProbe: {}
    readinessProbe: {}
  dispatcher:
    replicas: 1
    resources: {}
    extraArgs: []
    livenessProbe: {}
    readinessProbe: {}
  ingester:
    replicas: 1
    resources: {}
    extraArgs: []
    livenessProbe: {}
    readinessProbe: {}
  reconciler:
    replicas: 1
    resources: {}
    extraArgs: []
    livenessProbe: {}
    readinessProbe: {}

# Must exceed ORCH_SHUTDOWN_GRACE_SECONDS (default 20).
terminationGracePeriodSeconds: 30

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Extra ORCH_* settings, passed verbatim into the settings ConfigMap. Every key must
# start with ORCH_; anything else fails the render.
env: {}
  # ORCH_LOG_LEVEL: info

# Image of the claude-code-wrapper agent pods the reconciler creates (required,
# becomes ORCH_AGENT_IMAGE).
agentImage: ""

# Postgres connection. A connection is required: set exactly one of
#   1. cnpg.enabled=true              (the chart creates a CloudNativePG Cluster)
#   2. postgres.existingSecret        (an existing Secret holding a connection URI)
#   3. postgres.url                   (a full URI, stored in the chart Secret)
#   4. postgres.host + user + database (+ password, port, sslmode), composed into a URI
postgres:
  url: ""
  host: ""
  port: 5432
  database: ""
  user: ""
  # Raw password; user and password are URL-escaped when the URI is composed.
  password: ""
  # Empty omits ?sslmode= from the composed URI.
  sslmode: ""
  existingSecret: ""
  existingSecretKey: uri

# Optional CloudNativePG Cluster named <fullname>-db. Its app Secret <fullname>-db-app
# (key uri) feeds ORCH_DATABASE_URL. Requires the CNPG operator and its CRDs.
cnpg:
  enabled: false
  instances: 1
  # Empty uses the operator default image.
  imageName: ""
  database: agent_orchestrator
  owner: agent_orchestrator
  storage:
    size: 10Gi
    storageClass: ""
  walStorage:
    enabled: false
    size: 2Gi
    storageClass: ""
  resources: {}
  # Rendered verbatim as the Cluster spec.backup when non-empty
  # (barmanObjectStore, retentionPolicy, ...).
  backup: {}

# Key that encrypts stored per-cluster tokens (ORCH_MASTER_KEY). Set value (stored in
# <fullname>-master-key) or point existingSecret at your own Secret; one is required.
masterKey:
  existingSecret: ""
  existingSecretKey: master-key
  value: ""

# Claude OAuth token the agent pods read. Set token (stored in <fullname>-claude) or
# point existingSecret at a Secret in the release namespace; one is required.
claude:
  existingSecret: ""
  existingSecretKey: CLAUDE_CODE_OAUTH_TOKEN
  token: ""
